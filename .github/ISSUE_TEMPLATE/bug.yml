name: 不具合
description: 再現手順と期待した結果を記録します
title: "[不具合] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順と実際の結果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: アプリ版、Windows、素材形式、解像度、FPS。個人情報を含む素材は添付しないでください。
    validations:
      required: true
